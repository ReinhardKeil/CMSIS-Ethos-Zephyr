name: Test Ethos-U Zephyr (GCC)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }} Debug (GCC) on FVP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solution: GCC-Test-Ethos-U55
            target: SSE-300-U55
            app: app
            zephyr-ref: v4.4.0
          - solution: GCC-Test-Ethos-U85
            target: SSE-320-U85-NS
            app: app-u85
            zephyr-ref: 6607bdd711f49a6d1a971b3d6da2075cd918d8ed

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: script/requirements.txt

      - name: Install Vela and converter dependencies
        run: |
          python -m pip install ethos-u-vela -r script/requirements.txt
          vela --version

      - name: Set up CMSIS build tools
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ./vcpkg-configuration.json
          cache: cmsis-ethos-zephyr-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json') }}

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Set up Zephyr
        shell: bash
        run: |
          python -m pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr.git --mr "${{ matrix.zephyr-ref }}" zephyrproject
          cd zephyrproject
          west update
          west config manifest.group-filter -- +optional
          west update tflite-micro hal_ethos_u
          python -m pip install -r zephyr/scripts/requirements.txt

      - name: Install TF-M dependencies
        if: matrix.app == 'app-u85'
        run: |
          sudo apt-get update
          sudo apt-get install -y srecord
          python -m pip install -r zephyrproject/modules/tee/tf-m/trusted-firmware-m/tools/requirements.txt
          python -m pip install --no-deps zephyrproject/modules/tee/tf-m/trusted-firmware-m

      - name: Generate MLOps build information
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
        run: >-
          cbuild setup "${{ matrix.solution }}.csolution.yml"
          --active "${{ matrix.target }}"
          --packs

      - name: Compile models with Vela
        run: >-
          python script/model-converter.py
          "${{ matrix.solution }}.cbuild-mlops.yml"
          --out-dir "${{ matrix.app }}/model"

      - name: Build application
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
        run: cbuild "${{ matrix.solution }}.csolution.yml" --active "${{ matrix.target }}"

      - name: Verify HEX output
        run: test -s "out/Test-Ethos-U/${{ matrix.target }}/Debug/zephyr/zephyr.hex"

      - name: Run FVP
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.app }}" = "app-u85" ]; then
            build_dir="out/Test-Ethos-U/${{ matrix.target }}/Debug"
            FVP_Corstone_SSE-320 \
              -f fvp_config_u85.txt \
              --data "$build_dir/tfm/bin/bl1_1.bin@0x11000000" \
              --data "$build_dir/tfm/bin/cm_provisioning_bundle.bin@0x12024000" \
              --data "$build_dir/tfm/bin/dm_provisioning_bundle.bin@0x1202aa00" \
              --data "$build_dir/tfm/bin/bl2_signed.bin@0x12031400" \
              -a "$build_dir/zephyr/tfm_merged.hex" \
              --simlimit 120 2>&1 | tee fvp.log
          else
            FVP_Corstone_SSE-300_Ethos-U55 \
              -f fvp_config_u55.txt \
              -a out/Test-Ethos-U/SSE-300-U55/Debug/zephyr/zephyr.elf \
              --simlimit 120 2>&1 | tee fvp.log
          fi

          grep -Fq "[PASS] hello_world" fvp.log
          grep -Fq "[PASS] tiny_cnn" fvp.log
          grep -Fq "TEST RESULT: PASS" fvp.log

      - name: Upload build and FVP log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.solution }}
          path: |
            out/Test-Ethos-U
            fvp.log
          if-no-files-found: warn
          retention-days: 1
