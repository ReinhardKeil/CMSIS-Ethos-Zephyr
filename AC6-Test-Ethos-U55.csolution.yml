solution:
  description: Zephyr-native TensorFlow Lite Micro integration test for Ethos-U55 on Corstone-300 FVP
  created-for: CMSIS-Toolbox@2.15.0

  compiler: AC6

  packs:
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0

  target-types:
    - type: SSE-300-U55
      board: ARM::V2M-MPS3-SSE-300-FVP
      device: ARM::SSE-300-MPS3
      variables:
        - west-board: mps3/corstone300/fvp
      target-set:
        - set:
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300_Ethos-U55
            config-file: ./fvp_config_u55.txt
            args: ""
          images:
            - image: out/Test-Ethos-U/SSE-300-U55/Debug/zephyr/zephyr.hex

  build-types:
    - type: Debug
      west-defs:
        - CONFIG_BUILD_OUTPUT_HEX: y
        - CONFIG_BUILD_OUTPUT_BIN: n
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y

    - type: Release
      west-defs:
        - CONFIG_BUILD_OUTPUT_HEX: y
        - CONFIG_BUILD_OUTPUT_BIN: n
        - CONFIG_SIZE_OPTIMIZATIONS: y

  projects:
    - west:
        project-id: Test-Ethos-U
        app-path: ./app

  mlops:
    description: LiteRT example models for Ethos-U55
    npu:
      type: Ethos-U55
      macs: 128
    vela:
      system: Ethos_U55_High_End_Embedded
      memory: Shared_Sram
    model:
      dir: ./Model
      name:
        - hello_world/hello_world_int8.tflite
        - tiny_cnn/tiny_cnn_int8.tflite
    simulator:
      target: SSE-300-U55

