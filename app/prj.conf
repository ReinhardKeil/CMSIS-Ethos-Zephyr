# Build the application as C++17 with exception handling disabled.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n

# Enable TensorFlow Lite Micro inference with the 128-MAC Ethos-U55 accelerator.
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U55_128=y

# Reserve 8 KiB for the main thread stack and 16 KiB for the heap memory pool.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable floating-point printf output and Zephyr logging for diagnostics.
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_LOG=y

# Print the boot banner directly so deferred logging cannot interleave it with
# test output or leave it queued when EOT stops the FVP.
CONFIG_LOG_PRINTK=n
